<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Planilla - Cervantes School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .header-colegio { background: #2c3e50; color: white; padding: 20px; border-bottom: 5px solid #e74c3c; }
        .card { border: none; border-radius: 15px; }
        .stats-card { background: #ffffff; border-left: 5px solid #3498db; transition: transform 0.3s; }
        #seccion-login { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); }
        .login-card { width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 20px; background: rgba(255, 255, 255, 0.95); }
        .fila-docente:hover { background-color: #f8f9fa !important; }
        .badge-neto { font-size: 1rem; padding: 8px 12px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="seccion-login">
    <div class="card login-card shadow-lg text-center">
        <h3 class="fw-bold text-primary mb-4">Cervantes School</h3>
        <form id="form-login" class="text-start">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <input type="text" id="user" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" id="pass" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">INGRESAR</button>
        </form>
    </div>
</div>

<div id="seccion-principal" style="display: none;">
    <div class="header-colegio shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="m-0 fw-light">Control de <span class="fw-bold">Planillas</span></h2>
            <div class="text-end">
                <span id="badge-rol" class="badge bg-danger d-block mb-1"></span>
                <button class="btn btn-outline-light btn-sm" onclick="location.reload()">Salir</button>
            </div>
        </div>
    </div>

    <div class="container mt-4 mb-5">
        <div class="row g-3 mb-4" id="stats-container">
            <div class="col-md-6">
                <div class="card stats-card shadow-sm p-3">
                    <div class="text-muted small fw-bold">PLANILLA NETA TOTAL</div>
                    <div class="h3 mb-0" id="stat-planilla-total">S/ 0.00</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card stats-card shadow-sm p-3" style="border-left-color: #2ecc71;">
                    <div class="text-muted small fw-bold">PERIODO</div>
                    <select id="filtro-mes" class="form-select border-0 p-0" onchange="cargarDatos()">
                        <option value="5">Mayo 2026</option>
                        <option value="6">Junio 2026</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card shadow-lg">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark text-center">
                        <tr>
                            <th class="text-start">Docente</th>
                            <th>Sueldo Base</th>
                            <th>Neto a Pagar</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = {};
    const miModal = new bootstrap.Modal(document.getElementById('modalEditar')); // Asegúrate de tener el modal de tu código anterior

    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user, pass })
        });

        const data = await res.json();
        if (data.success) {
            currentUser = data;
            document.getElementById('seccion-login').style.display = 'none';
            document.getElementById('seccion-principal').style.display = 'block';
            document.getElementById('badge-rol').innerText = data.role.toUpperCase();
            
            // Ocultar stats si no es admin
            if(data.role !== 'admin') {
                document.getElementById('stats-container').style.display = 'none';
            }
            
            cargarDatos();
        } else {
            alert("Acceso denegado");
        }
    });

    async function cargarDatos() {
        const mes = document.getElementById('filtro-mes').value;
        const res = await fetch(`/api/docentes?mes=${mes}`, {
            headers: {
                'x-user-role': currentUser.role,
                'x-user-dni': currentUser.dni
            }
        });
        const docentes = await res.json();
        renderizarTabla(docentes);
    }

    function renderizarTabla(docentes) {
        const cuerpo = document.getElementById('tabla-cuerpo');
        cuerpo.innerHTML = '';
        let totalNetoGlobal = 0;

        docentes.forEach(d => {
            const sb = Number(d.sueldo_base);
            const neto = sb - (sb * 0.13) - Number(d.adelantos) - Number(d.faltas) - Number(d.pension) - Number(d.tardanza);
            totalNetoGlobal += neto;

            cuerpo.innerHTML += `
                <tr class="text-center">
                    <td class="text-start">
                        <strong>${d.nombre}</strong><br><small>DNI: ${d.dni}</small>
                    </td>
                    <td>S/ ${sb.toFixed(2)}</td>
                    <td><span class="badge bg-primary badge-neto">S/ ${neto.toFixed(2)}</span></td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-danger" onclick="descargarPDF(${d.id_docente})">
                                <i class="fa-solid fa-file-pdf"></i>
                            </button>
                            ${currentUser.role === 'admin' ? `
                                <button class="btn btn-sm btn-outline-success" onclick="enviarWhatsApp('${d.nombre}', ${neto.toFixed(2)}, ${d.id_docente})">
                                    <i class="fa-brands fa-whatsapp"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-primary" onclick="abrirModal(${d.id_docente})">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                            ` : ''}
                        </div>
                    </td>
                </tr>`;
        });
        document.getElementById('stat-planilla-total').innerText = `S/ ${totalNetoGlobal.toFixed(2)}`;
    }

    async function enviarWhatsApp(nombre, sueldo, id) {
        const filename = `boleta_${id}.pdf`;
        // El servidor nos da el link mágico configurado con tu número
        const res = await fetch(`/api/whatsapp-link?nombre=${nombre}&sueldo=${sueldo}&filename=${filename}`);
        const data = await res.json();
        window.open(data.link, '_blank');
    }

    // Nota: Aquí debes mantener tus funciones de generarPDF y abrirModal 
    // pero asegúrate de que usen la lógica de "currentUser" para seguridad.
</script>
</body>
</html>
