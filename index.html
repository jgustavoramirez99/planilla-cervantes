<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Planilla - Cervantes School</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Scripts Necesarios -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .header-colegio { background: #2c3e50; color: white; padding: 20px; border-bottom: 5px solid #e74c3c; }
        .card { border: none; border-radius: 15px; }
        .stats-card { background: #ffffff; border-left: 5px solid #3498db; }
        
        /* Insignia: Filtro blanco removido para ver colores reales */
        .logo-img { max-height: 80px; object-fit: contain; } 
        
        #seccion-login { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); }
        .login-card { width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 20px; background: rgba(255, 255, 255, 0.95); }
        .welcome-banner { background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; border-left: 5px solid #28a745; margin-bottom: 20px; display: none; }
        
        /* Estilo para filas de la tabla */
        .fila-docente { cursor: pointer; transition: 0.2s; }
        .fila-docente:hover { background-color: #f8f9fa !important; }
        .badge-neto { font-size: 1rem; padding: 8px 12px; border-radius: 8px; }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="seccion-login">
    <div class="card login-card shadow-lg text-center">
        <img src="logo.png" alt="Logo" class="logo-img mx-auto mb-3" onerror="this.src='https://via.placeholder.com/80?text=LOGO'">
        <h4 class="text-muted mb-1">I.E.P. Cervantes School</h4>
        <h3 class="fw-bold text-primary mb-4">Sistema de Planillas</h3>
        <form id="form-login" class="text-start">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <input type="text" id="user" class="form-control" placeholder="Ingrese usuario" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" id="pass" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">INGRESAR AL SISTEMA</button>
        </form>
    </div>
</div>

<!-- DASHBOARD PRINCIPAL -->
<div id="seccion-principal" style="display: none;">
    <div class="header-colegio shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <!-- Imagen sin filtro para que salga a color -->
                <img src="logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/60?text=LOGO'">
                <h2 class="m-0 fw-light">Control de <span class="fw-bold">Planillas</span></h2>
            </div>
            <div class="text-end text-white">
                <span id="badge-rol" class="badge bg-danger mb-1 d-block"></span>
                <button class="btn btn-outline-light btn-sm" onclick="location.reload()">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <div class="container mt-4 mb-5">
        <div id="banner-bienvenida" class="welcome-banner shadow-sm">
            <i class="fa-solid fa-user-tie me-2"></i> <strong>Bienvenido Promotor Edgar Cervantes</strong> - Panel Administrativo.
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stats-card shadow-sm p-3">
                    <div class="text-muted small fw-bold">DOCENTES ACTIVOS</div>
                    <div class="h3 mb-0" id="stat-total-personal">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stats-card shadow-sm p-3" style="border-left-color: #2ecc71;">
                    <div class="text-muted small fw-bold">TOTAL PLANILLA (NETO)</div>
                    <div class="h3 mb-0" id="stat-planilla-total">S/ 0.00</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="input-group h-100">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="buscador" class="form-control border-start-0" placeholder="Buscar por nombre o DNI...">
                </div>
            </div>
        </div>

        <div class="card shadow-lg">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre / DNI</th>
                                <th>Sueldo Base</th>
                                <th>AFP(13%)</th>
                                <th>Descuentos/Adelantos</th>
                                <th>Neto a Pagar</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-cuerpo"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE EDICIÓN (VENTANA FLOTANTE) -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalEditarLabel"><i class="fa-solid fa-user-pen me-2"></i>Editar Datos de Planilla</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre del Docente</label>
                    <input type="text" id="edit-nombre" class="form-control" readonly>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Sueldo Base</label>
                        <input type="number" id="edit-sb" class="form-control">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Adelantos</label>
                        <input type="number" id="edit-al" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold text-danger">Faltas</label>
                        <input type="number" id="edit-fl" class="form-control">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold text-danger">Pensión</label>
                        <input type="number" id="edit-pen" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold text-danger">Tardanza</label>
                    <input type="number" id="edit-tar" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" onclick="guardarCambiosModal()">
                    <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Cambios
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let docentesData = [];
    let userRole = '';
    const API_URL = 'https://planilla-cervantes.onrender.com/api/docentes';
    const miModal = new bootstrap.Modal(document.getElementById('modalEditar'));

    document.getElementById('form-login').addEventListener('submit', function(e) {
        e.preventDefault();
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === 'admin_cervantes' && p === 'cervantes2026') {
            document.getElementById('banner-bienvenida').style.display = 'block';
            iniciarSistema('MASTER');
        } else {
            document.getElementById('error-login').style.display = 'block';
        }
    });

    function iniciarSistema(rol) {
        userRole = rol;
        document.getElementById('seccion-login').style.display = 'none';
        document.getElementById('seccion-principal').style.display = 'block';
        document.getElementById('badge-rol').innerText = `MODO: ${rol}`;
        cargarDatosServidor();
    }

    function cargarDatosServidor() {
        fetch(API_URL).then(res => res.json()).then(data => {
            docentesData = data;
            renderizarTabla();
        });
    }

    function renderizarTabla() {
        const cuerpo = document.getElementById('tabla-cuerpo');
        cuerpo.innerHTML = '';
        docentesData.forEach(d => {
            const sb = parseFloat(d.sueldo_base) || 0;
            const afp = sb * 0.13;
            const neto = sb - afp - (parseFloat(d.adelantos)||0) - (parseFloat(d.faltas)||0) - (parseFloat(d.pension)||0) - (parseFloat(d.tardanza)||0);

            cuerpo.innerHTML += `
                <tr class="fila-docente">
                    <td onclick="abrirModal(${d.id_docente})">
                        <div class="fw-bold text-dark">${d.nombre}</div>
                        <small class="text-muted">${d.dni}</small>
                    </td>
                    <td>S/ ${sb.toFixed(2)}</td>
                    <td class="text-danger small fw-bold">- S/ ${afp.toFixed(2)}</td>
                    <td>
                        <div class="small">Adel: S/ ${d.adelantos} | Faltas: S/ ${d.faltas}</div>
                        <div class="small">Pens: S/ ${d.pension} | Tard: S/ ${d.tardanza}</div>
                    </td>
                    <td><span class="badge bg-primary badge-neto">S/ ${neto.toFixed(2)}</span></td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="generarBoletaPDF(${d.id_docente})" title="PDF"><i class="fa-solid fa-file-pdf"></i></button>
                        <button class="btn btn-sm btn-success" onclick="abrirModal(${d.id_docente})" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                    </td>
                </tr>`;
        });
        actualizarTotales();
    }

    function abrirModal(id) {
        if(userRole !== 'MASTER') return; // Solo el Master edita
        const d = docentesData.find(doc => doc.id_docente == id);
        if(!d) return;

        document.getElementById('edit-id').value = d.id_docente;
        document.getElementById('edit-nombre').value = d.nombre;
        document.getElementById('edit-sb').value = d.sueldo_base;
        document.getElementById('edit-al').value = d.adelantos;
        document.getElementById('edit-fl').value = d.faltas;
        document.getElementById('edit-pen').value = d.pension;
        document.getElementById('edit-tar').value = d.tardanza;
        
        miModal.show();
    }

    async function guardarCambiosModal() {
        const id = document.getElementById('edit-id').value;
        const payload = {
            sueldo_base: document.getElementById('edit-sb').value,
            adelantos: document.getElementById('edit-al').value,
            faltas: document.getElementById('edit-fl').value,
            pension: document.getElementById('edit-pen').value,
            tardanza: document.getElementById('edit-tar').value
        };
        
        try {
            const res = await fetch(`${API_URL}/${id}`, {
                method: 'PUT', 
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                miModal.hide();
                cargarDatosServidor(); // Recarga la tabla con los nuevos datos
            }
        } catch (err) { alert("Error al conectar con el servidor"); }
    }

    function actualizarTotales() {
        let totalNeto = 0;
        docentesData.forEach(d => {
            const sb = parseFloat(d.sueldo_base) || 0;
            const neto = sb - (sb*0.13) - (d.adelantos||0) - (d.faltas||0) - (d.pension||0) - (d.tardanza||0);
            totalNeto += neto;
        });
        document.getElementById('stat-total-personal').innerText = docentesData.length;
        document.getElementById('stat-planilla-total').innerText = `S/ ${totalNeto.toLocaleString('en-PE', {minimumFractionDigits:2})}`;
    }

    // BUSCADOR MEJORADO
    document.getElementById('buscador').addEventListener('keyup', function() {
        const query = this.value.toLowerCase().trim();
        const filas = document.querySelectorAll('.fila-docente');
        filas.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
        });
    });
</script>

<!-- BOLETA PDF (DISEÑO OCULTO - SE MANTIENE IGUAL) -->
<div id="plantilla-boleta" style="display: none; width: 750px; padding: 40px; background: white; color: black; position: absolute; left: -9999px;">
    <!-- Contenido del PDF... -->
</div>

</body>
</html>
