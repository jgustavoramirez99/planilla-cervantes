<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Planilla - Cervantes School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .header-colegio { background: #2c3e50; color: white; padding: 20px; border-bottom: 5px solid #e74c3c; }
        .logo-img { max-height: 70px; object-fit: contain; }
        .fila-docente { transition: 0.2s; }
        /* Solo el admin verá el cursor de "mano" para editar */
        .admin-mode .fila-docente { cursor: pointer; }
        .admin-mode .fila-docente:hover { background-color: #e9ecef !important; }
        
        #seccion-login { height: 100vh; display: flex; align-items: center; justify-content: center; background: #2c3e50; }
        .login-card { width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 15px; background: white; }
    </style>
</head>
<body>

<div id="seccion-login">
    <div class="card login-card shadow-lg text-center">
        <img src="logo.png" alt="Logo" class="logo-img mx-auto mb-3" onerror="this.src='https://i.imgur.com/8mXm6Z0.png'">
        <h4 class="fw-bold text-primary">Acceso al Sistema</h4>
        <form id="form-login" class="mt-4 text-start">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <input type="text" id="user" class="form-control" placeholder="nombre_apellido" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" id="pass" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">INGRESAR</button>
        </form>
    </div>
</div>

<div id="seccion-principal" style="display: none;">
    <div class="header-colegio shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <img src="logo.png" alt="Logo" class="logo-img" onerror="this.src='https://i.imgur.com/8mXm6Z0.png'">
                <h2 class="m-0" id="titulo-panel">Panel de Control</h2>
            </div>
            <div class="text-end">
                <span id="nombre-usuario-display" class="badge bg-light text-dark me-2"></span>
                <button class="btn btn-outline-light btn-sm" onclick="location.reload()">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row mb-4 align-items-end">
            <div class="col-md-4" id="stats-container">
                <div class="card p-3 border-0 shadow-sm" style="border-left: 5px solid #2ecc71 !important;">
                    <small class="text-muted fw-bold">TOTAL NETO A PAGAR</small>
                    <h3 id="stat-planilla-total">S/ 0.00</h3>
                </div>
            </div>
            <div class="col-md-4">
                <label class="small fw-bold">Mes de Consulta</label>
                <select id="filtro-mes" class="form-select" onchange="cargarDatosServidor()">
                    <option value="5">Mayo 2026</option>
                    <option value="6">Junio 2026</option>
                </select>
            </div>
        </div>

        <div class="card shadow border-0">
            <div class="table-responsive" id="contenedor-tabla">
                <table class="table align-middle mb-0">
                    <thead class="table-dark small text-center">
                        <tr>
                            <th class="text-start">Apellidos y Nombres</th>
                            <th>Sueldo Bruto</th>
                            <th>AFP/ONP</th>
                            <th>Adelantos</th>
                            <th>Faltas/Tard.</th>
                            <th>Neto a Pagar</th>
                            <th>Boleta</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Editar Planilla</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="form-edicion">
                <input type="hidden" id="edit-id">
                <div class="mb-3">
                    <label class="small fw-bold">Docente</label>
                    <input type="text" id="edit-nombre" class="form-control bg-light" readonly>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="small fw-bold">Sueldo Base (S/)</label>
                        <input type="number" id="edit-sb" class="form-control">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="small fw-bold">Adelantos (S/)</label>
                        <input type="number" id="edit-al" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 mb-3">
                        <label class="small fw-bold">Faltas</label>
                        <input type="number" id="edit-fl" class="form-control">
                    </div>
                    <div class="col-4 mb-3">
                        <label class="small fw-bold">Pensión %</label>
                        <input type="number" id="edit-pen" class="form-control" step="0.01">
                    </div>
                    <div class="col-4 mb-3">
                        <label class="small fw-bold">Tardanza</label>
                        <input type="number" id="edit-tar" class="form-control">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success w-100" onclick="guardarCambiosModal()">Actualizar Datos</button>
            </div>
        </div>
    </div>
</div>

<script>
    let docentesData = [];
    let userRole = '';
    let loggedUserNombre = '';
    const API_URL = 'https://planilla-cervantes.onrender.com/api/docentes';
    const miModal = new bootstrap.Modal(document.getElementById('modalEditar'));

    // --- LÓGICA DE LOGIN DINÁMICO ---
    document.getElementById('form-login').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('user').value.toLowerCase().trim();
        const p = document.getElementById('pass').value;
        
        if(u === 'admin_cervantes' && p === 'cervantes2026') {
            userRole = 'admin';
            loggedUserNombre = 'Administrador';
        } else if (p === 'boleta2026') {
            // Cualquier usuario que no sea Juan Perez entra con su nombre y contraseña general
            if(u === 'juan_perez') {
                alert("Acceso restringido para este usuario.");
                return;
            }
            userRole = 'user';
            loggedUserNombre = u.replace('_', ' ').toUpperCase();
        } else {
            return alert("Credenciales incorrectas.");
        }

        iniciarApp();
    });

    function iniciarApp() {
        document.getElementById('seccion-login').style.display = 'none';
        document.getElementById('seccion-principal').style.display = 'block';
        document.getElementById('nombre-usuario-display').innerText = loggedUserNombre;
        
        if(userRole === 'admin') {
            document.body.classList.add('admin-mode');
            document.getElementById('titulo-panel').innerText = "Panel Administrador";
        } else {
            document.getElementById('stats-container').style.display = 'none';
            document.getElementById('titulo-panel').innerText = "Mi Boleta de Pago";
        }
        cargarDatosServidor();
    }

    async function cargarDatosServidor() {
        const mes = document.getElementById('filtro-mes').value;
        const res = await fetch(`${API_URL}?mes=${mes}`);
        docentesData = await res.json();
        renderizarTabla();
    }

    function renderizarTabla() {
        const cuerpo = document.getElementById('tabla-cuerpo');
        cuerpo.innerHTML = '';
        let totalPlanilla = 0;

        // FILTRADO: Si es user, solo ve su fila. Si es admin, ve todo.
        let listaAMostrar = (userRole === 'admin') ? 
            docentesData : 
            docentesData.filter(d => d.nombre.toLowerCase().includes(loggedUserNombre.split(' ')[0].toLowerCase()));

        listaAMostrar.forEach(d => {
            const sb = Number(d.sueldo_base) || 0;
            const adelanto = Number(d.adelantos) || 0;
            const faltas = Number(d.faltas) || 0;
            const tardanza = Number(d.tardanza) || 0;
            const porcPension = Number(d.pension) || 11.84;
            const descLey = sb * (porcPension / 100);
            const neto = sb - descLey - adelanto - faltas - tardanza;
            totalPlanilla += neto;

            const tr = document.createElement('tr');
            tr.className = 'fila-docente';
            
            // Solo activar clic de edición si es ADMIN
            if(userRole === 'admin') {
                tr.onclick = () => abrirModal(d.id_docente);
            }

            tr.innerHTML = `
                <td>
                    <div class="fw-bold small text-uppercase">${d.nombre}</div>
                    <div class="text-muted" style="font-size: 10px;">DNI: ${d.dni}</div>
                </td>
                <td class="text-center">S/ ${sb.toFixed(2)}</td>
                <td class="text-center text-muted small">${porcPension}%</td>
                <td class="text-center text-danger">S/ ${adelanto.toFixed(2)}</td>
                <td class="text-center text-danger">S/ ${(faltas + tardanza).toFixed(2)}</td>
                <td class="text-center"><span class="badge bg-primary">S/ ${neto.toFixed(2)}</span></td>
                <td class="text-center" onclick="event.stopPropagation()">
                    <button class="btn btn-sm btn-danger" onclick="generarBoletaPDF(${d.id_docente})">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </td>
            `;
            cuerpo.appendChild(tr);
        });
        document.getElementById('stat-planilla-total').innerText = `S/ ${totalPlanilla.toFixed(2)}`;
    }

    // --- GENERACIÓN DE PDF BLINDADA (No se mueve nada) ---
    function generarBoletaPDF(id) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const d = docentesData.find(x => x.id_docente == id);
        
        const sb = Number(d.sueldo_base) || 0;
        const porcP = Number(d.pension) || 11.84;
        const descP = sb * (porcP / 100);
        const adel = Number(d.adelantos) || 0;
        const faltasTar = (Number(d.faltas) || 0) + (Number(d.tardanza) || 0);
        const neto = sb - descP - adel - faltasTar;

        // Encabezado Fijo
        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("I.E.P. CERVANTES SCHOOL", 105, 20, { align: "center" });
        doc.setFontSize(10);
        doc.text("BOLETA DE PAGO PERSONAL - MAYO 2026", 105, 28, { align: "center" });
        
        doc.setLineWidth(0.5);
        doc.line(20, 35, 190, 35);

        // Datos del Docente
        doc.setFontSize(11);
        doc.text("DATOS DEL TRABAJADOR", 20, 45);
        doc.setFont("helvetica", "normal");
        doc.text(`Apellidos y Nombres: ${d.nombre.toUpperCase()}`, 20, 55);
        doc.text(`DNI: ${d.dni}`, 20, 62);
        
        // Tabla de Conceptos
        doc.setFont("helvetica", "bold");
        doc.text("CONCEPTO", 20, 80);
        doc.text("INGRESOS", 120, 80);
        doc.text("DESCUENTOS", 160, 80);
        doc.line(20, 82, 190, 82);

        doc.setFont("helvetica", "normal");
        doc.text("Sueldo Bruto", 20, 90);
        doc.text(`S/ ${sb.toFixed(2)}`, 120, 90);

        doc.text(`Pensión (${porcP}%)`, 20, 100);
        doc.text(`S/ ${descP.toFixed(2)}`, 160, 100);

        doc.text("Adelantos", 20, 110);
        doc.text(`S/ ${adel.toFixed(2)}`, 160, 110);

        doc.text("Faltas y Tardanzas", 20, 120);
        doc.text(`S/ ${faltasTar.toFixed(2)}`, 160, 120);

        doc.line(20, 130, 190, 130);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text("NETO A RECIBIR:", 20, 140);
        doc.text(`S/ ${neto.toFixed(2)}`, 120, 140);

        // Pie de página
        doc.setFontSize(9);
        doc.setFont("helvetica", "italic");
        doc.text("Documento generado por el Sistema de Planillas de Cervantes School.", 105, 160, { align: "center" });

        doc.save(`Boleta_${d.nombre.replace(' ', '_')}.pdf`);
    }

    // Funciones de guardado se mantienen del código anterior...
    function abrirModal(id) {
        const d = docentesData.find(x => x.id_docente == id);
        document.getElementById('edit-id').value = d.id_docente;
        document.getElementById('edit-nombre').value = d.nombre;
        document.getElementById('edit-sb').value = d.sueldo_base;
        document.getElementById('edit-al').value = d.adelantos;
        document.getElementById('edit-fl').value = d.faltas;
        document.getElementById('edit-pen').value = d.pension;
        document.getElementById('edit-tar').value = d.tardanza;
        miModal.show();
    }

    async function guardarCambiosModal() {
        const id = document.getElementById('edit-id').value;
        const payload = {
            sueldo_base: document.getElementById('edit-sb').value,
            adelantos: document.getElementById('edit-al').value,
            faltas: document.getElementById('edit-fl').value,
            pension: document.getElementById('edit-pen').value,
            tardanza: document.getElementById('edit-tar').value,
            mes: document.getElementById('filtro-mes').value
        };
        const res = await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if(res.ok) { miModal.hide(); cargarDatosServidor(); }
    }
</script>
</body>
</html>
